[tool.poetry]
name = "ai-ofm-bot"
version = "0.1.0"
description = "AI OFM Store Bot — automated Telegram platform for selling digital goods via crypto"
authors = ["Artem Gavrilov"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
aiogram = "^3.13.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"
redis = {extras = ["hiredis"], version = "^5.2.0"}
pydantic-settings = "^2.6.1"
aiocryptopay = "^0.4.0"
aiofiles = "^24.1.0"
ujson = "^5.10.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
